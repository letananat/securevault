[package]
name = "securevault"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = "0.10"          # Chiffrement AES-256-GCM
pbkdf2 = { version = "0.12", features = ["hmac"] }
sha2 = "0.10"             # SHA-256 pour PBKDF2
hmac = "0.12"
rand = "0.8"              # Génération de sel aléatoire
serde = { version = "1", features = ["derive"] }
bincode = "1"             # Sérialisation binaire
clap = { version = "4", features = ["derive"] }  # CLI
rpassword = "7"           # Saisie mot de passe sans écho
chrono = { version = "0.4", features = ["serde"] }  # Timestamps
thiserror = "1"           # Macros d erreur
anyhow = "1"             # Gestion d erreur anyhow
serde_json = "1.0.149"

